# Moban FU Case Tracker — Docker Compose
# Usage:
#   Development: docker compose up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # Backend API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moban-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@db:5432/moban}
      - WAHA_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WA_GROUP_ID=${WA_GROUP_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-WAHA}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://9router.tefambo.site/v1}
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
      - ACCESS_CODES=${ACCESS_CODES:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}
      - MEDIA_DIR=/app/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    networks:
      - moban-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
 
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: moban-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=moban
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema-v1-2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed-v1-2.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./schema-multi-group.sql:/docker-entrypoint-initdb.d/03-multigroup.sql:ro
    ports:
      - "5432:5432"
    networks:
      - moban-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moban"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  moban-net:
    driver: bridge
