# Nginx reverse proxy — config LIVE di VPS (migrated to ~/stc_tracker/nginx/)
# Container: moban-nginx (service "nginx" di docker-compose.yml)
# Mount: ./nginx/conf.d/default.conf -> /etc/nginx/conf.d/default.conf
# Certs: /home/ubuntu/frontend/nginx/certs -> /etc/letsencrypt (via NGINX_CERTS_DIR di .env)
# Renew cert: cron certbot harian menulis ke /home/ubuntu/frontend/nginx/certs (webroot)

# Zone untuk limit_req di sini SAH: file di conf.d/ di-include dari http block.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

server {
    listen 80;
    server_name api.stc.syfa.site;

    # ACME challenge dilayani via HTTP dari webroot certbot (TIDAK di-redirect)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.stc.syfa.site;

    ssl_certificate /etc/letsencrypt/live/api.stc.syfa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.stc.syfa.site/privkey.pem;

    # Anti brute-force login access-code (v1.11 — fix #5): 5 percobaan/menit/IP
    location /api/auth/ {
        limit_req zone=auth_login burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://moban-tracker:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://moban-tracker:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
