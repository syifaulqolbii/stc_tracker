# Sisipkan di dalam <VirtualHost _default_:443> pada conf/extra/httpd-ssl.conf
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 120

# X-Forwarded-For penting: uvicorn jalan dengan --proxy-headers dan app memakai
# request.client.host untuk rate limit per IP. Kalau header ini hilang, semua
# klien terlihat sebagai 127.0.0.1 dan satu pengguna menghabiskan kuota
# RATE_LIMIT_RPM seluruh kantor. ProxyAddHeaders=On adalah default Apache 2.4;
# ditulis eksplisit supaya tidak berubah kalau ada conf lain yang mematikannya.
ProxyAddHeaders On

ProxyPass        /it-tracker/ http://127.0.0.1:8000/
ProxyPassReverse /it-tracker/ http://127.0.0.1:8000/

RedirectMatch ^/it-tracker$ /it-tracker/docs
